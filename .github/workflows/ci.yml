name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on PRs (rapid pushes). For main, let every run finish
  # so each merge produces its own nightly image and `:sha-<short>` tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          version: 2026.5.4
          install: true
          cache: true

      - name: Install Rust components
        run: rustup component add rustfmt clippy llvm-tools-preview

      - name: Cargo cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint workflows
        run: actionlint

      - name: Test + coverage gate
        # cargo-llvm-cov is pinned in .mise.toml. It builds instrumented test
        # binaries, runs them, and fails the job if line coverage drops below
        # the threshold. Raise the threshold here when coverage goes up; do not
        # lower it without recording why.
        run: cargo llvm-cov --all-targets --locked --summary-only --fail-under-lines 90

      - name: Build (release)
        run: cargo build --release --locked

  docker:
    name: docker build
    # PR-only amd64 smoke build: proves the Dockerfile still builds, fast (native,
    # no QEMU). arm64 is built and pushed at merge by publish-nightly, which runs
    # the full multi-arch build. Emulating a full Rust release compile for arm64
    # under QEMU here costs ~15 min/commit and is not worth it per PR push; the
    # tradeoff is that an arm64-only Dockerfile/base-image break surfaces at merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build image (amd64, no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: cloudseeder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-nightly:
    name: publish nightly image
    # docker is PR-only and skipped on main, so depend on test only. The full
    # multi-arch (amd64+arm64) build happens in this job's own build+push step.
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925  # v4.1.0
        with:
          version: 2026.5.4
          install: true
          cache: true

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked --version 0.13.10

      - name: Compute and apply nightly version
        id: nightly
        run: |
          # Read the next-pending release version from Cargo.toml and increment its patch
          # component. main always carries a clean release-style version (no pre-release
          # suffix); the release workflow guarantees this. Then suffix with date +
          # github.run_number for a globally monotonic, date-prefixed nightly version.
          CURRENT=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT_PATCH="${MAJOR}.${MINOR}.$((PATCH + 1))"
          DATE=$(date -u +%Y%m%d)
          NIGHTLY_VERSION="${NEXT_PATCH}-nightly.${DATE}.${GITHUB_RUN_NUMBER}"
          cargo set-version "$NIGHTLY_VERSION"
          # version stays plain SemVer (Cargo rejects a `v` prefix); tag carries
          # the `v` so nightly image tags match release's `:vX.Y.Z`. Mirrors the
          # version/tag split in release.yml's bump step.
          echo "version=$NIGHTLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NIGHTLY_VERSION"     >> "$GITHUB_OUTPUT"
          echo "Building nightly: v$NIGHTLY_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Set up QEMU
        # Emulates arm64 on the x86_64 runner so buildx can produce both archs.
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.nightly.outputs.tag }}
            type=raw,value=nightly
            type=sha,prefix=sha-,format=short

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
