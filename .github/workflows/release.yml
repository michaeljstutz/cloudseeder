name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (semver)'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  # Serialize releases — never run two of these at once.
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  verify:
    name: prepare and verify
    runs-on: ubuntu-latest
    # Releases only ever cut from main. Editing this workflow on a branch and
    # dispatching it from that branch is a footgun: the bump + tag + push would
    # all land on the wrong branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag:     ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # No write step runs in this job, so don't keep the token around in .git/config.
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac  # v2.4.4
        with:
          install: true
          cache: true

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked --version 0.13.10

      - name: Bump version
        id: bump
        env:
          # Pass dispatch input via env, not direct interpolation, to keep workflow_dispatch
          # inputs out of shell command construction (defense in depth even though `type:
          # choice` already constrains the value).
          BUMP: ${{ inputs.bump }}
        run: |
          cargo set-version --bump "$BUMP"
          # cargo set-version updates Cargo.lock in place, so no separate `cargo update` is
          # needed; the locked verify build below will fail loudly if the lock is stale.
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Bumped to v$VERSION"

      - name: Verify build and tests
        run: |
          cargo build --release --locked
          cargo test --all-targets --locked

      - name: Upload bumped manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: bumped-manifests
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 1

  publish:
    name: tag and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Apply bumped manifests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: bumped-manifests
          path: .

      - name: Verify manifests landed
        run: |
          test -f Cargo.toml -a -f Cargo.lock
          echo "Cargo.toml version after download:"
          awk -F'"' '/^version = /{print $2; exit}' Cargo.toml

      - name: Commit and tag
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "release: $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "HEAD:$BRANCH"
          git push origin "$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # Also overwrite :nightly so it tracks the release (the GITHUB_TOKEN push above
          # won't re-trigger CI's publish-nightly job, so we refresh it here ourselves).
          tags: |
            type=raw,value=${{ needs.verify.outputs.tag }}
            type=raw,value=latest
            type=raw,value=nightly

      - name: Build and push release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
