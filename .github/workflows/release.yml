name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (semver)'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  # Serialize releases — never run two of these at once.
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  verify:
    name: prepare and verify
    runs-on: ubuntu-latest
    # Releases only ever cut from main. Editing this workflow on a branch and
    # dispatching it from that branch is a footgun: the bump + tag + push would
    # all land on the wrong branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag:     ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # No write step runs in this job, so don't keep the token around in .git/config.
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
        with:
          version: 2026.5.4
          install: true
          cache: true

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked --version 0.13.10

      - name: Bump version
        id: bump
        env:
          # Pass dispatch input via env, not direct interpolation, to keep workflow_dispatch
          # inputs out of shell command construction (defense in depth even though `type:
          # choice` already constrains the value).
          BUMP: ${{ inputs.bump }}
        run: |
          cargo set-version --bump "$BUMP"
          # cargo set-version updates Cargo.lock in place, so no separate `cargo update` is
          # needed; the locked verify build below will fail loudly if the lock is stale.
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Bumped to v$VERSION"

      - name: Verify build and tests
        run: |
          cargo build --release --locked
          cargo test --all-targets --locked

      - name: Upload bumped manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bumped-manifests
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
          retention-days: 1

  build:
    name: build ${{ matrix.target }}
    needs: verify
    # Don't kill the other targets if one fails — we want to see all failures at once.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            # Apple Silicon runner cross-compiles to x86_64 via `rustup target add`.
            # Avoids the deprecating Intel macos-13 runner label.
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151  # v4.0.1
        with:
          version: 2026.5.4
          install: true
          cache: true

      - name: Apply bumped manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bumped-manifests
          path: .

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive binary + LICENSE
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ARCHIVE="cloudseeder-v${VERSION}-${TARGET}.tar.gz"
          mkdir -p staging
          cp "target/${TARGET}/release/cloudseeder" staging/
          cp LICENSE staging/
          tar -C staging -czf "${ARCHIVE}" cloudseeder LICENSE
          ls -l "${ARCHIVE}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: cloudseeder-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: tag and publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Apply bumped manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bumped-manifests
          path: .

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: bin-*
          path: dist/
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          # Combined checksums in the standard `shasum -c` / `sha256sum -c` format.
          # Single file per release keeps verification ergonomic for downloaders.
          shasum -a 256 -- *.tar.gz > SHA256SUMS
          echo "Release assets:"
          ls -l
          echo
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Verify manifests landed
        run: |
          test -f Cargo.toml -a -f Cargo.lock
          echo "Cargo.toml version after download:"
          awk -F'"' '/^version = /{print $2; exit}' Cargo.toml

      - name: Commit and tag
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "release: $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "HEAD:$BRANCH"
          git push origin "$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Set up QEMU
        # Emulates arm64 on the x86_64 runner so buildx can produce both archs.
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # Also overwrite :nightly so it tracks the release (the GITHUB_TOKEN push above
          # won't re-trigger CI's publish-nightly job, so we refresh it here ourselves).
          tags: |
            type=raw,value=${{ needs.verify.outputs.tag }}
            type=raw,value=latest
            type=raw,value=nightly

      - name: Build and push release image (multi-arch)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release with binaries and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
