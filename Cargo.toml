[package]
name = "cloudseeder"
version = "0.0.0"
edition = "2021"
description = "Dynamic template-based server for Ubuntu autoinstall and Red Hat kickstart configs."
license = "MIT"
repository = "https://github.com/michaeljstutz/cloudseeder"
readme = "README.md"

[dependencies]
axum = "0.7"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
